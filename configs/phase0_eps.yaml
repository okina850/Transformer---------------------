# Phase 0: sqrt 分母の eps スイープ
#
# 目的: Q = 1 + sqrt(eps + A^2) の eps を、2つの条件を同時に満たすように選ぶ。
#   (上限) eps が大きいと近似精度が頭打ちになる（sqrt(eps) の下駄）
#   (下限) eps が小さいと sqrt が abs に漸近し、R3/R4 と R1/R2 が区別できなくなる
# 下限の判定には T5 の実測 pre-activation 分布が要るので、T5 の後に実行する。
#
# 実行: python scripts/run_phase0_eps.py --config configs/phase0_eps.yaml

seed: 0

targets: [gelu_tanh, silu]

intervals:
  - {name: wide,  lo: -6.0, hi: 6.0}
  - {name: paper, lo: -3.0, hi: 3.0}

# Day 2 で真の折れ点が出たのは gelu_tanh の [5,4]@paper と [6,5]@wide。
# その2つを含む範囲を掃く。
degrees:
  - {m: 5, n: 4}
  - {m: 6, n: 5}
  - {m: 7, n: 6}

eps_values: [1.0e-1, 3.0e-2, 1.0e-2, 3.0e-3, 1.0e-3, 1.0e-4, 1.0e-6, 1.0e-8]

fit:
  grid: uniform
  n_fit: 2001
  n_eval: 20001
  sk_iters: 5
  weight: uniform
  n_random_inits: 2

# abs との差がこの値を超える x を「平滑化が効いている領域」とみなす
diff_tol: 1.0e-3

extrapolation: {lo: -15.0, hi: 15.0, n: 30001}

# T5 の測定結果（層別ヒストグラム）。null なら最新の実行を自動で拾う
preact_stats: null

figures: true
